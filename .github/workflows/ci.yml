  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and test frontend
        working-directory: ./medical-centre-ui
        run: |
          ls -la package-lock.json
          npm ci
          npm run build

  acceptance-test:
    needs: [build-and-test, frontend-build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build all services
        run: mvn clean package -DskipTests

      - name: Start infrastructure and services with Docker Compose
        run: |
          docker-compose up -d --build kafka mongodb keycloak
          # Wait for infrastructure to be ready
          sleep 30
          docker-compose up -d --build ms-patients-service ms-medics-service ms-appointments-service ms-notification-service medical-centre-ui
          # Wait for services to be healthy
          sleep 30

      - name: Wait for services to be healthy
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is up"
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "API Gateway is up"
              break
            fi
            echo "Waiting for API Gateway... ($i/30)"
            sleep 2
          done

      - name: Run Playwright Acceptance Tests
        run: mvn -pl acceptance-test test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: acceptance-test/target/surefire-reports/
          retention-days: 30

      - name: Stop Docker Compose
        if: always()
        run: docker-compose down -v

  docker-build:
    needs: [build-and-test, frontend-build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service images
        run: |
          docker build -t medical-centre-api-gateway ./ms-api-gateway
          docker build -t medical-centre-patients ./ms-patients-service
          docker build -t medical-centre-medics ./ms-medics-service
          docker build -t medical-centre-appointments ./ms-appointments-service
          docker build -t medical-centre-notification ./ms-notification-service
          docker build -t medical-centre-identity ./ms-identity-service
          docker build -t medical-centre-ui ./medical-centre-ui