apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: traceId
          matcherRegex: 'trace_id=([0-9a-fA-F]+)'
          url: '${{ datasource.uid:jaeger }}/trace/$1'
          datasourceUid: jaeger

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: jaeger
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        tags: ['trace_id', 'span_id', 'service.name']
        spanStartTimeShift: 1h
        spanEndTimeShift: -1h
        filterByTraceID: true
        filterBySpanID: true